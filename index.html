<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="КЭА" />
  <title>КЭА — Мониторинг</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #1e293b;
      --bg3: #334155;
      --border: rgba(148,163,184,0.12);
      --accent: #3b82f6;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --text3: #64748b;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --cat1: #6366f1; --cat2: #8b5cf6; --cat3: #ec4899;
      --cat4: #f59e0b; --cat5: #10b981; --cat6: #06b6d4; --cat7: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }

    .app { max-width: 520px; margin: 0 auto; padding-bottom: 60px; }

    /* Header */
    header { padding: 20px 16px 16px; }
    .header-row { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; color: var(--text3); text-transform: uppercase; }
    .live { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text3); }
    .live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
    .title { margin-top: 10px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }

    /* Counters */
    .counters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 0 16px 12px; }
    .cnt { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; text-align: center; }
    .cnt-val { font-size: 24px; font-weight: 700; }
    .cnt-lbl { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }
    .cnt-blue .cnt-val { color: var(--accent); }
    .cnt-green .cnt-val { color: var(--green); }
    .cnt-amber .cnt-val { color: var(--amber); }

    /* Tabs */
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 16px; margin-bottom: 12px; }
    .tab { padding: 8px 14px; font-size: 12px; font-weight: 500; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Filters */
    .filters { display: flex; gap: 6px; padding: 0 16px 12px; overflow-x: auto; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .fbtn { flex-shrink: 0; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text3); font-family: 'Inter',sans-serif; font-size: 11px; cursor: pointer; transition: all .2s; }
    .fbtn.active { background: var(--accent); border-color: var(--accent); color: white; }

    /* Search */
    .search-wrap { padding: 0 16px 12px; }
    .search { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); font-family: 'Inter',sans-serif; font-size: 12px; outline: none; }
    .search::placeholder { color: var(--text3); }
    .search:focus { border-color: var(--accent); }

    /* Cards */
    .cards { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; transition: all .2s; }
    .card:hover { border-color: rgba(59,130,246,.3); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .card-title { font-size: 13px; font-weight: 600; line-height: 1.3; flex: 1; }
    .card-id { font-size: 10px; color: var(--text3); flex-shrink: 0; padding: 2px 6px; background: var(--bg3); border-radius: 4px; }
    .card-cat { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; font-weight: 500; }
    .card-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .card-label { font-size: 10px; color: var(--text3); flex-shrink: 0; min-width: 55px; }
    .card-value { font-size: 11px; color: var(--text2); flex: 1; line-height: 1.4; }
    .card-person { font-size: 11px; color: var(--text2); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }

    /* Category colors */
    .cat-eco { background: rgba(16,185,129,.15); color: var(--green); }
    .cat-strat { background: rgba(99,102,241,.15); color: var(--cat1); }
    .cat-market { background: rgba(236,72,153,.15); color: var(--cat3); }
    .cat-tariff { background: rgba(245,158,11,.15); color: var(--amber); }
    .cat-tech { background: rgba(6,182,212,.15); color: var(--cat6); }
    .cat-hr { background: rgba(139,92,246,.15); color: var(--cat2); }
    .cat-kea { background: rgba(59,130,246,.15); color: var(--accent); }

    /* Win card */
    .win-card { background: var(--bg2); border: 1px solid rgba(16,185,129,.2); border-radius: 10px; padding: 14px; }
    .win-card .card-title { color: var(--green); }

    /* Empty state */
    .empty { padding: 40px 16px; text-align: center; color: var(--text3); font-size: 13px; }

    /* Loading */
    .loading { display: flex; flex-direction: column; align-items: center; padding: 60px 16px; gap: 12px; }
    .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 8px 16px; background: rgba(15,23,42,.95); backdrop-filter: blur(8px); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--text3); z-index: 100; }
    .rbtn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text3); font-family: 'Inter',sans-serif; font-size: 10px; cursor: pointer; }
    .rbtn:active { background: var(--bg3); }

    /* Count badge */
    .count-badge { font-size: 11px; color: var(--text3); margin-left: 4px; }

    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    .card, .win-card { animation: fadeIn .25s ease both; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-row">
      <div class="logo">Казахстанская электроэнергетическая ассоциация</div>
      <div class="live"><div class="live-dot"></div>LIVE</div>
    </div>
    <div class="title">Мониторинг задач</div>
  </header>

  <div class="counters">
    <div class="cnt cnt-blue"><div class="cnt-val" id="c-tasks">—</div><div class="cnt-lbl">В работе</div></div>
    <div class="cnt cnt-green"><div class="cnt-val" id="c-wins">—</div><div class="cnt-lbl">Победы</div></div>
    <div class="cnt cnt-amber"><div class="cnt-val" id="c-pending">—</div><div class="cnt-lbl">На согласовании</div></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="tasks">Задачи</div>
    <div class="tab" data-tab="wins">Победы</div>
  </div>

  <div id="tasks-view">
    <div class="search-wrap"><input class="search" id="search" placeholder="Поиск по задачам..." /></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="cards"></div>
  </div>

  <div id="wins-view" style="display:none">
    <div class="cards" id="win-cards"></div>
  </div>

  <div id="loading" style="display:none"><div class="loading"><div class="spinner"></div></div></div>
</div>

<footer>
  <span id="update-time">Загрузка...</span>
  <button class="rbtn" onclick="loadData()">↻ Обновить</button>
</footer>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzaKKKWlJonU3ciu0Wbdr6pJt8f8nzt-zP7Xg2DHJrEoVEfXA6QgumyP3ygsL79ljN3/exec';

let allTasks = [], allWins = [];
let currentTab = 'tasks', currentCat = 'all', searchQuery = '';

const catMap = {
  'Экология': { cls: 'cat-eco', short: 'Экология' },
  'Стратегия': { cls: 'cat-strat', short: 'Стратегия' },
  'Рынок': { cls: 'cat-market', short: 'Рынок' },
  'Тарифы': { cls: 'cat-tariff', short: 'Тарифы' },
  'Техн': { cls: 'cat-tech', short: 'Техника' },
  'Кадры': { cls: 'cat-hr', short: 'Кадры' },
  'КЭА': { cls: 'cat-kea', short: 'КЭА' }
};

function getCat(cat) {
  if (!cat) return { cls: 'cat-kea', short: '—' };
  for (const [key, val] of Object.entries(catMap)) {
    if (cat.includes(key)) return val;
  }
  return { cls: 'cat-kea', short: cat.substring(0, 12) };
}

async function loadData() {
  document.getElementById('loading').style.display = 'block';
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?t=' + Date.now());
    const data = await res.json();
    allTasks = data.tasks || [];
    allWins = data.wins || [];

    document.getElementById('c-tasks').textContent = allTasks.length;
    document.getElementById('c-wins').textContent = data.winsCount || 0;
    document.getElementById('c-pending').textContent = data.pendingCount || 0;

    const now = new Date();
    document.getElementById('update-time').textContent =
      now.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });

    buildFilters();
    render();
  } catch(e) {
    document.getElementById('cards').innerHTML =
      '<div class="empty">⚠️ Ошибка загрузки данных</div>';
  }
  document.getElementById('loading').style.display = 'none';
}

function buildFilters() {
  const cats = [...new Set(allTasks.map(t => getCat(t.category).short))];
  let html = '<button class="fbtn active" data-cat="all">Все</button>';
  cats.forEach(c => { html += `<button class="fbtn" data-cat="${c}">${c}</button>`; });
  document.getElementById('filters').innerHTML = html;

  document.querySelectorAll('.fbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      render();
    });
  });
}

function render() {
  if (currentTab === 'tasks') renderTasks();
  else renderWins();
}

function renderTasks() {
  let tasks = [...allTasks];

  if (currentCat !== 'all') {
    tasks = tasks.filter(t => getCat(t.category).short === currentCat);
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    tasks = tasks.filter(t =>
      (t.task||'').toLowerCase().includes(q) ||
      (t.status||'').toLowerCase().includes(q) ||
      (t.responsible||'').toLowerCase().includes(q)
    );
  }

  if (!tasks.length) {
    document.getElementById('cards').innerHTML = '<div class="empty">Нет задач</div>';
    return;
  }

  let html = '';
  tasks.forEach((t, i) => {
    const cat = getCat(t.category);
    html += `<div class="card" style="animation-delay:${i*30}ms">
      <div class="card-top">
        <div class="card-title">${esc(t.task)}</div>
        <div class="card-id">#${t.id}</div>
      </div>
      <div class="card-cat ${cat.cls}">${cat.short}</div>
      ${t.status ? `<div class="card-row"><div class="card-label">Статус</div><div class="card-value">${esc(t.status)}</div></div>` : ''}
      ${t.nextStep ? `<div class="card-row"><div class="card-label">Шаг</div><div class="card-value">${esc(t.nextStep)}</div></div>` : ''}
      <div class="card-person">👤 ${esc(t.responsible || '—')}${t.govBody ? ' · 🏛 ' + esc(t.govBody) : ''}</div>
    </div>`;
  });

  document.getElementById('cards').innerHTML = html;
}

function renderWins() {
  if (!allWins.length) {
    document.getElementById('win-cards').innerHTML = '<div class="empty">Нет побед</div>';
    return;
  }
  let html = '';
  allWins.forEach((w, i) => {
    const cat = getCat(w.category);
    html += `<div class="win-card" style="animation-delay:${i*30}ms">
      <div class="card-top">
        <div class="card-title">✅ ${esc(w.task)}</div>
      </div>
      <div class="card-cat ${cat.cls}">${cat.short}</div>
      ${w.result ? `<div class="card-row"><div class="card-label">Результат</div><div class="card-value">${esc(w.result)}</div></div>` : ''}
    </div>`;
  });
  document.getElementById('win-cards').innerHTML = html;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    document.getElementById('tasks-view').style.display = currentTab === 'tasks' ? 'block' : 'none';
    document.getElementById('wins-view').style.display = currentTab === 'wins' ? 'block' : 'none';
    render();
  });
});

// Search
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
